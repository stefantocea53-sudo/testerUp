<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testerup | Official Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --tester-blue: #2ecc71; /* Verdele Testerup */
            --bg-dark: #0a0c10;
            --card-bg: rgba(17, 21, 28, 0.8);
            --gold: #d4af37;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #111827 0%, #0a0c10 100%);
        }

        .glass-card {
            width: 90%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.7s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shield-icon {
            font-size: 3.5rem;
            color: var(--tester-blue);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(46, 204, 113, 0.3));
        }

        .badge-verified {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid var(--tester-blue);
            color: var(--tester-blue);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        h1 span {
            background: linear-gradient(to right, #fff, var(--tester-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .check-list {
            text-align: left;
            margin: 30px 0;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .check-item i {
            color: var(--tester-blue);
            font-size: 1rem;
        }

        .btn-main {
            background: white;
            color: black;
            padding: 22px;
            border-radius: 20px;
            text-decoration: none;
            display: block;
            font-weight: 900;
            font-size: 1.4rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        .btn-main:hover {
            transform: scale(1.03);
            background: var(--tester-blue);
            color: white;
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.4);
        }

        .btn-main span {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            opacity: 0.8;
        }

        .footer-secure {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="shield-icon">
            <i class="fas fa-user-shield"></i>
        </div>

        <div class="badge-verified">
            <i class="fas fa-check-circle"></i> Official Tester Invite
        </div>

        <h1>Become a <span>Premium</span> Game Tester</h1>

        <div class="check-list">
            <div class="check-item">
                <i class="fas fa-check"></i>
                <span>Exclusive access to beta games</span>
            </div>
            <div class="check-item">
                <i class="fas fa-check"></i>
                <span>Direct payouts via PayPal</span>
            </div>
            <div class="check-item">
                <i class="fas fa-check"></i>
                <span>Work from anywhere (Mobile)</span>
            </div>
        </div>

        <a href="offer.html" class="btn-main">
            YES, I'M READY
            <span>Check Availability in Your Region</span>
        </a>

        <div class="footer-secure">
            <i class="fas fa-lock"></i> Secure 256-bit Connection
        </div>
    </div>

</body>
</html>
